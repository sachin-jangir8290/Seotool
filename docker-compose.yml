services:
  seotool:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional: enables Custom AI agents and the Assistant
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Set to "production" only when serving over HTTPS (secure cookies)
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - seotool-data:/data
volumes:
  seotool-data:
